name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    name: Test and build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        run: python -m pip install -e ".[test,linked-selects]"
      - name: Run tests
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  conda-package:
    name: Build Conda package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: django-htmx-views-build
          auto-activate: false
          channel-priority: strict
          conda-remove-defaults: true
          environment-file: conda-recipe/build-env.yml
          show-channel-urls: true
      - name: Resolve package output
        shell: bash -el {0}
        run: |
          CONDA_PACKAGE="$(conda-build conda-recipe --output)"
          test -n "$CONDA_PACKAGE"
          echo "CONDA_PACKAGE=$CONDA_PACKAGE" >> "$GITHUB_ENV"
      - name: Build Conda package
        shell: bash -el {0}
        run: conda-build conda-recipe
      - uses: actions/upload-artifact@v4
        with:
          name: conda-package
          path: ${{ env.CONDA_PACKAGE }}
