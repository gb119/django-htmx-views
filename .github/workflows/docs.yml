name: Documentation

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: pages

permissions:
  contents: read
  id-token: write
  pages: write

defaults:
  run:
    shell: bash -el {0}

jobs:
  pages:
    name: Build and deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create the documentation environment
        uses: conda-incubator/setup-miniconda@a4260408e20b96e80095f42ff7f1a15b27dd94ca
        with:
          activate-environment: django-htmx-views-docs
          auto-activate-base: false
          environment-file: docs/environment.yml
          show-channel-urls: true

      - name: Install the package
        run: python -m pip install -e ".[linked-selects]"

      - name: Build Sphinx documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

      - id: deployment
        name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
