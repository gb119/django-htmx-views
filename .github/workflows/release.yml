name: Publish release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose package source should be published
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  publish:
    name: Build and publish Python and Conda packages
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Check out the release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Create the package-build environment
        uses: conda-incubator/setup-miniconda@a4260408e20b96e80095f42ff7f1a15b27dd94ca
        with:
          activate-environment: django-htmx-views-build
          auto-activate: false
          channel-priority: strict
          conda-remove-defaults: true
          environment-file: conda-recipe/build-env.yml
          show-channel-urls: true

      - name: Verify the release tag matches the package version
        run: |
          PACKAGE_VERSION="$(
            python -c 'from htmx_views import __version__; print(__version__)'
          )"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Install and test the release source
        run: |
          python -m pip install -e ".[test,linked-selects]"
          python -m pytest

      - name: Build Python distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Build the Conda package
        id: conda-package
        run: |
          CONDA_PACKAGE="$(conda-build conda-recipe --output)"
          test -n "$CONDA_PACKAGE"
          conda-build conda-recipe
          test -f "$CONDA_PACKAGE"
          echo "path=$CONDA_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Upload the Conda package
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA }}
          CONDA_PACKAGE: ${{ steps.conda-package.outputs.path }}
        run: |
          test -n "$ANACONDA_API_TOKEN"
          anaconda upload \
            --user phygbu \
            --label main \
            --no-progress \
            "$CONDA_PACKAGE"

      - name: Upload Python distributions to PyPI
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_USERNAME: __token__
        run: python -m twine upload dist/*
