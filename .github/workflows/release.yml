name: Publish release

on:
  release:
    types:
      - published

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  publish:
    name: Build and publish Python and Conda packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create the package-build environment
        uses: conda-incubator/setup-miniconda@a4260408e20b96e80095f42ff7f1a15b27dd94ca
        with:
          activate-environment: django-htmx-views-build
          auto-activate-base: false
          environment-file: conda-recipe/build-env.yml
          show-channel-urls: true

      - name: Verify the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(
            python -c 'from htmx_views import __version__; print(__version__)'
          )"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Install and test the release source
        run: |
          python -m pip install -e ".[test,linked-selects]"
          python -m pytest

      - name: Build Python distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Build and upload the Conda package
        uses: uibcdf/action-build-and-upload-conda-packages@4940704d2be7906d3bda5b00e3c3e4472fd7808f
        with:
          label: main
          meta_yaml_dir: conda-recipe
          overwrite: false
          python-version: "3.12"
          token: ${{ secrets.ANACONDA }}
          user: phygbu

      - name: Upload Python distributions to PyPI
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_USERNAME: __token__
        run: python -m twine upload dist/*
