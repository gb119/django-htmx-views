[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-htmx-views"
dynamic = ["version"]
description = "Reusable Django view services for HTMX-enabled applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Gavin Burnell" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "Django>=4.2",
  "django-htmx>=1.17",
]

[project.optional-dependencies]
docs = [
  "Sphinx>=7,<9",
  "django-ajax-selects>=2.2",
  "sphinx-better-theme>=0.1.5",
]
linked-selects = [
  "django-ajax-selects>=2.2",
]
bootstrap5 = [
  "django-bootstrap5>=23.4",
]
test = [
  "build>=1.2",
  "django-ajax-selects>=2.2",
  "pytest>=8",
  "pytest-django>=4.8",
  "tomli>=2; python_version < '3.11'",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/gb119/django-htmx-views"
Repository = "https://github.com/gb119/django-htmx-views"
Issues = "https://github.com/gb119/django-htmx-views/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
htmx_views = ["templates/**/*.html"]

[tool.setuptools.dynamic]
version = { attr = "htmx_views.__version__" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
